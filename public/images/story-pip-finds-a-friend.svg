<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Pip the Penguin Finds a Friend cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74b9ff"/>
      <stop offset="1" stop-color="#00cec9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bg)"/>
  <rect width="1000" height="750" fill="url(#glow)"/>
  <!-- iceberg -->
  <path d="M120 620 L260 470 L420 620 Z" fill="#ffffff" opacity="0.45"/>
  <path d="M640 640 L780 510 L920 640 Z" fill="#ffffff" opacity="0.4"/>
  <!-- snow dots -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="180" cy="160" r="8"/><circle cx="320" cy="120" r="6"/><circle cx="700" cy="150" r="7"/><circle cx="850" cy="220" r="6"/><circle cx="520" cy="100" r="5"/>
  </g>
  <!-- scarf -->
  <path d="M470 560 q30 30 60 0 l-6 60 q-24 14 -48 0 Z" fill="#ffd32a" opacity="0.9"/>
  <!-- central badge -->
  <circle cx="500" cy="370" r="175" fill="#ffffff" opacity="0.2"/>
  <circle cx="500" cy="370" r="150" fill="#ffffff" opacity="0.15"/>
  <text x="500" y="375" font-size="240" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI Emoji','Noto Color Emoji','Apple Color Emoji',sans-serif">🐧</text>
</svg>

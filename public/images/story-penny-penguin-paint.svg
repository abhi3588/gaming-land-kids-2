<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Penny Penguin's Rainbow Ice cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74b9ff"/>
      <stop offset="1" stop-color="#a29bfe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bg)"/>
  <rect width="1000" height="750" fill="url(#glow)"/>
  <!-- Rainbow ice streaks -->
  <path d="M-50 600 Q 250 500 500 620 T 1050 580" fill="none" stroke="#ff7675" stroke-width="24" opacity="0.6"/>
  <path d="M-50 640 Q 250 540 500 660 T 1050 620" fill="none" stroke="#ffeaa7" stroke-width="24" opacity="0.6"/>
  <path d="M-50 680 Q 250 580 500 700 T 1050 660" fill="none" stroke="#55efc4" stroke-width="24" opacity="0.6"/>
  <!-- Central badge -->
  <circle cx="500" cy="375" r="175" fill="#ffffff" opacity="0.2"/>
  <circle cx="500" cy="375" r="150" fill="#ffffff" opacity="0.15"/>
  <text x="500" y="380" font-size="240" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI Emoji','Noto Color Emoji','Apple Color Emoji',sans-serif">🐧</text>
</svg>

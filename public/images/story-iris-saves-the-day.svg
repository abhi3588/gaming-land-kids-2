<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Ice Queen Iris Saves the Day cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74b9ff"/>
      <stop offset="1" stop-color="#a29bfe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bg)"/>
  <rect width="1000" height="750" fill="url(#glow)"/>
  <!-- snowflakes -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <g transform="translate(160 160)"><line x1="-26" y1="0" x2="26" y2="0"/><line x1="0" y1="-26" x2="0" y2="26"/><line x1="-18" y1="-18" x2="18" y2="18"/><line x1="-18" y1="18" x2="18" y2="-18"/></g>
    <g transform="translate(840 200)"><line x1="-22" y1="0" x2="22" y2="0"/><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-15" y1="-15" x2="15" y2="15"/><line x1="-15" y1="15" x2="15" y2="-15"/></g>
    <g transform="translate(120 520)"><line x1="-18" y1="0" x2="18" y2="0"/><line x1="0" y1="-18" x2="0" y2="18"/></g>
  </g>
  <!-- frozen flame -->
  <g transform="translate(820 540)">
    <path d="M0 -60 C40 -10 30 30 0 50 C-30 30 -40 -10 0 -60 Z" fill="#ffffff" opacity="0.5"/>
    <path d="M0 -35 C22 -5 16 18 0 32 C-16 18 -22 -5 0 -35 Z" fill="#74b9ff" opacity="0.8"/>
  </g>
  <!-- central badge -->
  <circle cx="500" cy="375" r="175" fill="#ffffff" opacity="0.2"/>
  <circle cx="500" cy="375" r="150" fill="#ffffff" opacity="0.15"/>
  <text x="500" y="380" font-size="240" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI Emoji','Noto Color Emoji','Apple Color Emoji',sans-serif">🧊</text>
</svg>

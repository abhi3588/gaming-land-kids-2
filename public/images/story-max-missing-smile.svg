<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Max and the Missing Smile cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#ff6b9d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bg)"/>
  <rect width="1000" height="750" fill="url(#glow)"/>
  <!-- little house -->
  <g transform="translate(150 470)" opacity="0.85">
    <rect x="0" y="60" width="120" height="110" rx="8" fill="#fff" opacity="0.9"/>
    <path d="M-10 60 L60 -5 L130 60 Z" fill="#ff6b9d"/>
    <rect x="46" y="110" width="34" height="60" rx="4" fill="#ff9f43"/>
    <circle cx="75" cy="142" r="4" fill="#fff"/>
  </g>
  <!-- flowers -->
  <g>
    <g transform="translate(820 600)" fill="#fff">
      <circle r="12"/><circle cx="0" cy="-22" r="12"/><circle cx="0" cy="22" r="12"/><circle cx="-22" cy="0" r="12"/><circle cx="22" cy="0" r="12"/>
      <circle r="9" fill="#ffd32a"/>
    </g>
    <g transform="translate(880 650)" fill="#fff">
      <circle r="10"/><circle cx="0" cy="-18" r="10"/><circle cx="0" cy="18" r="10"/><circle cx="-18" cy="0" r="10"/><circle cx="18" cy="0" r="10"/>
      <circle r="7" fill="#ffd32a"/>
    </g>
  </g>
  <!-- hearts -->
  <text x="300" y="180" font-size="46" font-family="'Segoe UI Emoji','Noto Color Emoji',sans-serif" opacity="0.85">❤️</text>
  <text x="700" y="150" font-size="34" font-family="'Segoe UI Emoji','Noto Color Emoji',sans-serif" opacity="0.8">💛</text>
  <!-- central badge -->
  <circle cx="500" cy="375" r="175" fill="#ffffff" opacity="0.2"/>
  <circle cx="500" cy="375" r="150" fill="#ffffff" opacity="0.15"/>
  <text x="500" y="380" font-size="240" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI Emoji','Noto Color Emoji','Apple Color Emoji',sans-serif">🐻</text>
</svg>
